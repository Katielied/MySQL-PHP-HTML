<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" 
        content="width=device-width, initial-scale=1"/>
        <title>To-Do List</title>
        <style>
          /*  Here is an outline of CSS selectors and styles for the to-do list app.
              You may expand upon or modify these styles as you see fit. Make it your own! */
            html {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100%;
                background-color: #e0e0e0;
            }

            body {
                font-family: Arial, sans-serif;
                width: 80%;
                max-width: 600px;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
                border: 8px solid #333;
                border-radius: 8px;
            }

            header, footer {
                background-color: #333;
                color: white;
                text-align: center;
                padding: 1em 0;
            }

            section {
                margin: 20px;
            }

            .input-row{
                display:flex;
                gap:8px;
                margin-bottom:18px;
            }
            
            .input-row input[type="text"]{
                flex:1;
                padding:12px 14px;
                border-radius:10px;
                border:1px solid #222; background-color: ghostwhite;
                color:inherit;
                outline:none;
            }

            /* Every selector after this point was not implemented in class. Implement them as you see fit!
               I intentionally left out values so you can decide on your own design choices. This is only a template.
               You are welcome to change the contents of the selectors if you prefer different styles. 
            */
            .btn{
                padding:5px;
                border-radius:10px;
                border:1px solid black;
                background: lightgray;
                font-weight:2px;
                cursor:pointer;
            }

            .btn:active{ transform:translateY(0.5px) }
            .btn:hover{ background-color: rgb(229, 227, 227); }

            .controls{
                display:flex;
                gap: 20px;
                align-items:center;
                justify-content:left;
                margin-bottom:10px;
            }

            .filters{
                display:flex;
                gap: 10px;
            }

            .filter{
                background:transparent;
                border:1px solid black;
                padding:10px;
                border-radius:5px;
                cursor:pointer;
                color:black;
            }

            .filter.active{
                border:2px solid lightblue; 
                color:rgb(122, 172, 188);
                font-weight:30px;
            }

            ul.todo-list{
                list-style:none;
                padding:2px;
                margin:5px;
                display:grid;
                gap:10px;
            }

            li.task{
                display:flex;
                align-items:center;
                gap:2px;
                padding:10px;
                border-radius:10px;
                background: white;
                border:5px solid lightblue;
            }

            li .left{
                display:flex;
                gap:2px;
                flex:1;
            }

            .checkbox{
                width:20px;
                height:20px;
                border-radius:10px;
                border:1px solid black;
                display:inline-grid;
                place-items:center;
                cursor:pointer;
            }

            .checkbox input{ display:none; }

            .checkbox.checked{
                background:lightblue;
                border:1px solid rgb(0, 0, 0);
            }

            .task-text{ font-size:18px; }

            .task-text.completed{
                text-decoration:line-through; 
                color: rgb(99, 97, 97);
            }

            .task-actions{
                display:flex;
                gap:2px;
            }

            .icon-btn{
                background:transparent;
                border:0.5px solid rgb(116, 116, 116);
                padding:5px;
                width: 32px;
                height: 32px;
                border-radius:10px;
                cursor:pointer;
            }

            .icon-btn:hover{ background: lightblue; }
            .icon-btn:active{ transform: translateY(1px); }

            #newTaskInput {
                flex: 1;
                padding: 5px;
                width: 10px;
                border-radius: 10px;
                font-size: 18px;
            }
         
            #taskList {
                list-style-type: none;
                padding: 0;
            }

            #taskList li {
                margin-bottom: 5px;
                border-radius: 10px;
                padding: 5px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .empty {
                text-align: center;
                color: black;
                font-weight: bold;
            }

            #clearCompletedTasks {
                background-color: lightblue;
                color: black;
                border: 1px solid lightgray;
                padding: 5px;
                border-radius: 5px;
                cursor: pointer;
            }

            #clearCompletedTasks:hover{
                background-color: rgb(220, 232, 236);
            }

            #clearCompletedTasks:active{
                transform: translateY(0.5px);
            }

            #stats{
                font-weight: bold;
            }
          */
        </style>
    </head>
    <body>
        <header>
            <div>
                <h1>To-Do List</h1>
            </div>
        </header>

        <section>
            <div class="input-row">
                <input id="newTaskInput" type="text"
                placeholder="What do you need to do?">
                <button id="addBtn" class="btn">Add</button>
            </div>
            <div class="controls">
                <div class="filters">
                    <button class="filter active" data-filter="all">All</button>
                    <button class="filter" data-filter="active">Active</button>
                    <button class="filter" data-filter="completed">Completed</button>
                </div>
                <div id="stats">
                    0 tasks
                </div>
            </div>
        </section>

        <section>
            <ul id="taskList"></ul>
            <div id="emptyState" class="empty" style="display:none">No tasks yet.</div>
        </section>

        <footer>
            <div>
                <button id="clearCompletedTasks">
                    Clear completed tasks
                </button>
            </div>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
